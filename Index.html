<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CriptoSafe</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #050505, #123a78);
      color: white;
    }

    .card {
      width: 92%;
      max-width: 500px;
      padding: 30px;
      text-align: center;
      border-radius: 20px;
      background: rgba(255,255,255,0.08);
      box-shadow: 0 0 30px rgba(0,0,0,0.5);
      backdrop-filter: blur(15px);
    }

    .logo {
      font-size: 110px;
      font-weight: bold;
      line-height: 1;
      margin-bottom: 10px;
      text-shadow: 0 0 25px #3b82f6;
    }

    h1 {
      margin: 5px 0 10px;
    }

    p {
      color: #cbd5e1;
    }

    textarea {
      width: 100%;
      height: 120px;
      margin-top: 15px;
      padding: 15px;
      border: none;
      border-radius: 10px;
      resize: none;
      font-size: 16px;
      outline: none;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    #resultado,
    #audioArea {
      display: none;
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      background: rgba(0,0,0,0.3);
    }

    #resultado {
      word-break: break-all;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="logo">?</div>

    <h1>🔐 CriptoSafe</h1>

    <p>
      Criptografe seus textos de forma rápida e segura.
    </p>

    <textarea
      id="texto"
      placeholder="Digite seu texto...">
    </textarea>

    <button onclick="criptografar()">
      🔒 Criptografar
    </button>

    <div id="resultado"></div>

    <div id="audioArea">
      <p>✅ Processo concluído!</p>

      <button onclick="tocarAudio()">
        ▶️ Continuar
      </button>
    </div>

  </div>

  <audio id="audio" src="audio.mp3"></audio>

  <script>
    function criptografar() {
      const texto = document.getElementById("texto").value;

      if (texto.trim() === "") {
        alert("Digite algum texto primeiro!");
        return;
      }

      const resultado = btoa(
        unescape(encodeURIComponent(texto))
      );

      document.getElementById("resultado").style.display = "block";
      document.getElementById("resultado").textContent = resultado;

      document.getElementById("audioArea").style.display = "block";
    }

    function tocarAudio() {
      const audio = document.getElementById("audio");

      audio.currentTime = 0;
      audio.play();
    }
  </script>

</body>
</html>
